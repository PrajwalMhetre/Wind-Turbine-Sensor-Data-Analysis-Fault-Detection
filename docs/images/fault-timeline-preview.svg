<g stroke="#334155"><path d="M210 120H900 M210 180H900 M210 240H900 M210 300H900"/></g>
<g fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15"><text x="48" y="150">High vibration</text><text x="48" y="210">High temperature</text><text x="48" y="270">Low power</text></g>
<g fill="#94a3b8" font-family="Arial,sans-serif" font-size="12"><text x="210" y="330">00:00</text><text x="370" y="330">06:00</text><text x="530" y="330">12:00</text><text x="690" y="330">18:00</text><text x="860" y="330">24:00</text></g>
