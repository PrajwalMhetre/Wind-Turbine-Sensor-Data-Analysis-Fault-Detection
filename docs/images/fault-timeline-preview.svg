<rect x="430" y="192" width="120" height="24" rx="5" fill="#fbbf24"/><rect x="660" y="192" width="80" height="24" rx="5" fill="#fbbf24"/>
<rect x="260" y="252" width="90" height="24" rx="5" fill="#38bdf8"/><rect x="580" y="252" width="145" height="24" rx="5" fill="#38bdf8"/></g>
