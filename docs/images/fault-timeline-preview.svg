<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Illustrative fault event timeline</title><desc id="desc">Synthetic event bars for vibration, temperature, and low power categories.</desc>
