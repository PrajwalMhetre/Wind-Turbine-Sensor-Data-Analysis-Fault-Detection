<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Illustrative wind speed versus power curve</title><desc id="desc">Synthetic sample scatter plot showing increasing power with wind speed and a highlighted low-power example.</desc>
<rect width="960" height="420" rx="18" fill="#0b1220"/><text x="48" y="48" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="24" font-weight="700">Wind Speed vs Power — Preview</text><text x="48" y="76" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Illustrative synthetic points · not a turbine performance curve</text>
<g stroke="#334155"><path d="M100 120H900 M100 180H900 M100 240H900 M100 300H900 M100 360H900"/><path d="M100 110V360H900"/></g>
<g fill="#94a3b8" font-family="Arial,sans-serif" font-size="12"><text x="54" y="124">2000</text><text x="54" y="184">1500</text><text x="54" y="244">1000</text><text x="62" y="304">500</text><text x="76" y="364">0</text><text x="100" y="390">0</text><text x="300" y="390">5</text><text x="500" y="390">10</text><text x="700" y="390">15</text><text x="890" y="390">20</text><text x="420" y="410">Wind speed (m/s)</text><text transform="translate(24 260) rotate(-90)">Power (kW)</text></g>
<path d="M100 360 C230 360 300 350 380 300 S520 190 640 135 S780 120 900 120" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7"/>
<g fill="#38bdf8"><circle cx="170" cy="358" r="6"/><circle cx="240" cy="350" r="6"/><circle cx="310" cy="336" r="6"/><circle cx="380" cy="305" r="6"/><circle cx="450" cy="270" r="6"/><circle cx="500" cy="225" r="6"/><circle cx="560" cy="190" r="6"/><circle cx="620" cy="155" r="6"/><circle cx="690" cy="132" r="6"/><circle cx="760" cy="125" r="6"/><circle cx="830" cy="122" r="6"/></g><circle cx="620" cy="280" r="9" fill="#fb7185" stroke="#fff" stroke-width="2"/><text x="640" y="275" fill="#fecdd3" font-family="Arial,sans-serif" font-size="13">Example low-power point</text>
</svg>